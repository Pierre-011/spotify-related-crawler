name: Spotify Related Artists Crawler

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: spotify-related-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run crawler
        env:
          CRAWLER_MAX_SECONDS: "540"
          HEADLESS: "1"
          SPOTIFY_LANGUAGE: "intl-fr"
          PAGE_WAIT_MS: "2500"
          SCROLL_COUNT: "5"
        run: python src/crawler.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/artistes.json data/state.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update discovered artists"
            git push
          fi
